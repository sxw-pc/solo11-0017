# Demo scan used by README quick start.
# The target is an HTTP service running on this machine only.
seed = "http://127.0.0.1:5001/"

[scope]
allow_subdomains = false
include = []
exclude = ["^/search"]

[limits]
max_depth = 3
max_pages = 60
timeout_s = 3.0
retries = 2
delay_ms = 20
concurrency = 1
max_redirects = 5

[robots]
respect = true
user_agent = "linkpatrol-demo/0.1"

[external]
check = true

# Per-host failure circuit breaker for external links. Disabled by default;
# enable to stop re-requesting a host that keeps failing within one run.
[circuit]
enabled = false
threshold = 5
window_s = 300.0
count_only_server_errors = true
probe_allowance = 0

[normalize]
drop_params = ["utm_*", "fbclid"]

[output]
dir = "reports"
database = "out/linkpatrol.db"
sitemap = "out/sitemap.xml"
